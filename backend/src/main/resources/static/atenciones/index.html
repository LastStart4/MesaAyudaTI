<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervenciones de soporte | Mesa de Ayuda TI</title>
    <link rel="stylesheet" href="css/atenciones.css">
</head>
<body>

<header>
    <h1>Mesa de Ayuda TI Universitaria</h1>
    <p>Intervenciones del equipo de soporte tecnológico</p>
</header>

<main>
    <section>
        <h2>Intervenciones de soporte</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ticket</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Ticket #101</td>
                    <td><span class="estado pendiente">Pendiente</span></td>
                    <td><button class="btn">Atender</button></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Ticket #102</td>
                    <td><span class="estado en-atencion">En Atención</span></td>
                    <td><button class="btn">Resolver</button></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Ticket #103</td>
                    <td><span class="estado resuelto">Resuelto</span></td>
                    <td><button class="btn">Ver detalle</button></td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

<footer>
    <p>Mesa de Ayuda TI &copy; 2026 - Intervenciones de soporte</p>
</footer>

</body>
</html>
